# Deploy HappyWife store to Cloudflare on push to main.
#
# Flow:  Muse (change, reviewed by the owner) -> GitHub main
#        -> this workflow -> Cloudflare Worker + D1 + R2 (runtime content)
#
# What this workflow does, and does NOT do:
#   DOES: build (via npm run deploy), apply remote D1 migrations,
#         deploy the Worker. The Worker then serves R2 content
#         (product images, private files) that Admin uploads at runtime.
#   DOES NOT: create D1 / R2 buckets, set AUTH_SECRET / SECRETS_KEK,
#             attach shop.keeg.org, or upload files to R2 from git.
#             Those are one-time setup, done once by the owner
#             (see docs/cloudflare-deploy-guide.md in the docs repo).
#             Buckets and secrets already set on the Worker persist
#             across deploys; this workflow must not rotate them.
#   DOES NOT: deploy on pull requests. PRs only run verify.yml.
#             Merging to main is the deploy gate.
#
# Required GitHub repo settings (Settings -> Secrets and variables):
#   Secrets:
#     CLOUDFLARE_API_TOKEN   - Workers Scripts: Edit, D1: Edit
#                              (and, if the zone is in the same account,
#                               Zone: Read for the custom domain to keep
#                               working; the domain itself is NOT
#                               re-attached by this workflow)
#     CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#   Variables (NOT secrets; ids and names are not credentials):
#     CF_WORKER_NAME         - e.g. happywife
#     CF_DB_NAME             - e.g. happywife-db
#     CF_DB_ID               - uuid from `wrangler d1 list`
#                              (or from .instances/<slug>.env after
#                               provision-cf ran once)
#     CF_BUCKET              - e.g. happywife-images
#     CF_FILES_BUCKET        - e.g. happywife-files
#
# Custom domain shop.keeg.org is attached once in the Cloudflare
# dashboard (Workers -> happywife -> Settings -> Domains) and
# persists across deploys. Do not add it to this workflow.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. Migrations + Worker deploy must never race
# each other. Do NOT cancel a deploy in progress.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      DO_NOT_TRACK: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Render instance wrangler config (runner only, not committed)
        run: |
          sed \
            -e "s/__NAME__/${{ vars.CF_WORKER_NAME }}/g" \
            -e "s/__DB_NAME__/${{ vars.CF_DB_NAME }}/g" \
            -e "s/__DB_ID__/${{ vars.CF_DB_ID }}/g" \
            -e "s/__BUCKET__/${{ vars.CF_BUCKET }}/g" \
            -e "s/__FILES_BUCKET__/${{ vars.CF_FILES_BUCKET }}/g" \
            wrangler.template.jsonc > wrangler.jsonc
          # Fail fast if a variable was left empty, instead of
          # deploying with a literal __PLACEHOLDER__ name.
          grep -q "__" wrangler.jsonc && { echo "Unfilled placeholder in wrangler.jsonc - check repo Variables"; exit 1; } || true

      - name: Deploy (build + theme check + remote migrations + Worker deploy)
        run: npm run deploy

      # R2 content note (intentionally no step here):
      # Product images and digital files are uploaded through
      # Admin -> Media at runtime and stored in R2 by the Worker.
      # They are NOT in git and must NOT be uploaded by CI.
      # If you ever need a one-off R2 upload, do it by hand:
      #   npx wrangler r2 object put <bucket>/<key> --file=<path>
